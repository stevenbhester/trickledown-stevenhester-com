<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trickle Down</title>
  <meta name="description" content="A daily game. $100 of fake money, real stocks, ten times the drama. The only real money flows down to charity.">
  <meta name="theme-color" content="#EDF1F2">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;900&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="masthead">
  <a class="wordmark" href="#today" aria-label="Trickle Down, home">
    <span class="wordmark-text">Trickle Down</span>
    <svg class="wordmark-drip" viewBox="0 0 10 14" aria-hidden="true"><path d="M5 0 C5 4 1 6.5 1 9.5 a4 4 0 0 0 8 0 C9 6.5 5 4 5 0Z"/></svg>
  </a>
  <div class="masthead-right">
    <div class="masthead-day" id="masthead-day" hidden>
      <span id="day-number">Day 1</span>
      <span id="day-countdown" class="muted"></span>
    </div>
    <button type="button" class="help-btn" id="btn-help" aria-label="How this works">?</button>
  </div>
</header>

<nav class="tabs" id="tabs" hidden aria-label="Sections">
  <a href="#today" data-tab="today">Today</a>
  <a href="#trickle" data-tab="trickle">Lobby</a>
  <a href="#leaders" data-tab="leaders">Leaders</a>
  <a href="#how" data-tab="how">How</a>
</nav>

<main id="main">
  <!-- Screens are rendered by js/app.js -->
  <section id="screen-welcome" class="screen"></section>
  <section id="screen-today" class="screen" hidden></section>
  <section id="screen-trickle" class="screen" hidden></section>
  <section id="screen-leaders" class="screen" hidden></section>
  <section id="screen-how" class="screen" hidden></section>
</main>

<footer class="foot" id="foot" hidden>
  <div class="ad-slot" aria-label="Advertisement">
    <span>Ad goes here. Every dollar it makes trickles down.</span>
  </div>
  <p class="foot-line">
    <span id="foot-user"></span>
    <button class="linkish" id="btn-claim" hidden>Keep this account</button>
    <button class="linkish" id="btn-signout">Sign out</button>
  </p>
</footer>

<!-- Lock-in sheet -->
<dialog id="dlg-sell" class="sheet">
  <form method="dialog" class="sheet-body" id="form-sell">
    <div class="sheet-head">
      <h2 id="sell-title">Lock it in</h2>
      <button type="button" class="close" data-close aria-label="Close">×</button>
    </div>
    <div id="sell-body"></div>
    <p class="form-error" id="sell-error" hidden></p>
    <button type="submit" class="btn primary wide" id="sell-submit">Lock in</button>
  </form>
</dialog>

<!-- Claim / sign in sheet -->
<dialog id="dlg-auth" class="sheet">
  <form method="dialog" class="sheet-body" id="form-auth">
    <div class="sheet-head">
      <h2 id="auth-title">Sign in</h2>
      <button type="button" class="close" data-close aria-label="Close">×</button>
    </div>
    <p class="muted" id="auth-blurb"></p>
    <label class="field"><span>Username</span><input id="auth-user" autocomplete="username" required minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+"></label>
    <label class="field"><span>Password</span><input id="auth-pass" type="password" autocomplete="current-password" required minlength="6"></label>
    <p class="form-error" id="auth-error" hidden></p>
    <button type="submit" class="btn primary wide" id="auth-submit">Sign in</button>
    <button type="button" class="linkish center" id="auth-switch">New here? Create an account</button>
  </form>
</dialog>

<!-- The advisors: today's cards, one at a time -->
<dialog id="dlg-advisors" class="sheet advisors" aria-label="Speak with your advisors">
  <div class="sheet-body">
    <div class="sheet-head">
      <h2>TrickleTown Hall</h2>
      <button type="button" class="close" data-close aria-label="Close">×</button>
    </div>
    <div id="adv-stage" class="adv-stage"></div>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="config.js"></script>
<script src="js/town.js"></script>
<script src="js/demo-api.js"></script>
<script src="js/api.js"></script>
<script src="js/coin.js"></script>
<script src="js/explainer.js"></script>
<script src="js/app.js"></script>
</body>
</html>
